<div data-bind="visible: selectedMethod() == 'c2w' || selectedMethod() == 'w2w'"
     id="warehouse-and-city-wrapper">
    <div class="field" data-bind="css: {'_required': required(), '_error': error()}">
        <label class="label label-np-help" data-bind="attr: {for: uid}">
            <span data-bind="i18n: 'Choose warehouse'"></span>
        </label>
        <select class="select" style="width: 100%;" data-bind="
    attr: {
        name: inputName,
        id: uid,
        disabled: disabled,
        'aria-describedby': getDescriptionId(),
        'aria-required': required,
        'aria-invalid': error() ? true : 'false',
        placeholder: placeholder
    },
    css: {'mage-error': error()},
    hasFocus: focused,
    optgroup: options,
    value: value,
    optionsCaption: caption,
    optionsValue: 'value',
    optionsText: 'label',
    afterRender: function (element) {
            select2(element);
        },
    optionsAfterRender: function(option, item) {
        if (item && item.disabled) {
            ko.applyBindingsToNode(option, {attr: {disabled: true}}, item);
        };
    }"></select>
        <!-- ko if: error() --><div class="mage-error" data-bind="text: error()"></div><!-- /ko -->
    </div>
</div>
